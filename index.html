<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Julian N. Petrow · ZenScents</title>
<meta name="description" content="Kontakt speichern oder direkt melden." />

<!-- Open Graph: controls the preview when the link is shared / tapped -->
<meta property="og:title" content="Julian N. Petrow, M.Sc." />
<meta property="og:description" content="Geschäftsführer · Parfümeur — ZenScents" />
<meta property="og:type" content="profile" />

<meta name="theme-color" content="#000000" />

<style>
  /* ---------- Design tokens: ZenScents ----------
     Schwarz als Bühne, Gold/Taupe #C4B893 nur für das, was man antippt. */
  :root{
    --page:       #000000;
    --glow:       #2a2619;   /* warmer Goldschimmer oben */
    --glow-2:     #0d0c09;
    --card:       #0c0c0b;
    --card-2:     #070707;
    --line:       rgba(196, 184, 147, 0.20);
    --line-soft:  rgba(196, 184, 147, 0.12);
    --fill:       rgba(255, 255, 255, 0.03);
    --fill-hover: rgba(196, 184, 147, 0.08);
    --accent:     #C4B893;   /* ZenScents Gold/Taupe */
    --accent-2:   #D3C9A8;
    --on-accent:  #000000;
    --cream:      #F2EDE4;
    --cream-dim:  rgba(242, 237, 228, 0.68);
    --r:          16px;

    --display: "Avenir Next", "Avenir", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --sans:    "Avenir Next", "Avenir", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  html{ background:var(--page); }
  body{
    min-height:100svh;
    font-family:var(--sans);
    color:var(--cream);
    background:
      radial-gradient(90% 55% at 50% -5%, var(--glow) 0%, var(--glow-2) 45%, var(--page) 85%) fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:
      max(16px, env(safe-area-inset-top))
      12px
      max(24px, env(safe-area-inset-bottom));
  }
  @media (min-height:900px){ body{ align-items:center; } }

  /* ---------- Card ---------- */
  .card{
    width:100%;
    max-width:440px;
    position:relative;
    border-radius:32px;
    background:linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border:1px solid var(--line);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 40px 90px -40px rgba(0,0,0,0.75);
    overflow:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{ position:relative; }
  .portrait{
    position:relative;
    aspect-ratio:4 / 4.6;
    overflow:hidden;
    background:#0a0a0a;
  }
  .portrait[hidden]{ display:none; }
  .portrait img, .portrait video{
    width:100%; height:100%; object-fit:cover; display:block;
    object-position:50% 30%;
  }
  .portrait::after{              /* Bild weich in die Karte auslaufen lassen */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 20%),
      linear-gradient(180deg, rgba(12,12,11,0) 45%, rgba(12,12,11,0.82) 76%, var(--card) 100%);
  }

  .hero-top{
    position:absolute; top:16px; left:16px; right:16px; z-index:3;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .eyebrow{
    margin:0;
    font-size:11px; font-weight:500;
    letter-spacing:0.24em; text-transform:uppercase;
    color:var(--cream);
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(196,184,147,0.30);
    background:rgba(0,0,0,0.45);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }

  .lang{
    display:flex; padding:3px; gap:2px;
    border:1px solid rgba(196,184,147,0.30); border-radius:999px;
    background:rgba(0,0,0,0.45);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .lang button{
    min-width:40px; min-height:32px;
    border:0; cursor:pointer; background:transparent; color:var(--cream-dim);
    font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:0.14em;
    padding:0 10px; border-radius:999px; transition:background .18s ease, color .18s ease;
  }
  .lang button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }

  .hero-text{
    position:relative; z-index:2;
    margin-top:-104px;
    padding:0 26px;
  }
  .portrait[hidden] + .hero-text{ margin-top:0; padding-top:84px; }

  h1{
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(20px, 6.1vw, 28px);
    line-height:1.12;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0 0 10px;
    color:var(--cream);
    text-shadow:0 2px 24px rgba(0,0,0,0.35);
  }
  h1 .nm, h1 .suffix{ white-space:nowrap; }
  h1 small{
    font-family:var(--sans);
    font-size:0.72em; font-weight:400; letter-spacing:0.04em;
    text-transform:none;
    color:var(--accent);
    white-space:nowrap;
  }
  .role{
    margin:0 0 14px;
    font-size:16px; line-height:1.45;
    color:var(--cream-dim);
  }
  .role b{ color:var(--cream); font-weight:600; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none; }
  .chips[hidden]{ display:none; }
  .chips li{
    font-size:13px; font-weight:500; letter-spacing:0.01em;
    color:var(--cream);
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--fill);
  }

  .monogram{ display:none; }   /* nur Fallback-Element, wird nicht mehr angezeigt */

  /* ---------- Body ---------- */
  .body{ padding:22px 26px 26px; display:flex; flex-direction:column; gap:10px; }

  /* Primary action */
  .save{
    width:100%;
    min-height:58px;
    border:0;
    cursor:pointer;
    font-family:var(--sans);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--on-accent);
    background:var(--accent);
    padding:0 18px;
    border-radius:var(--r);
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 16px 36px -16px rgba(196,184,147,0.55);
    transition:transform .12s ease, background-color .2s ease;
  }
  .save:hover{ background:var(--accent-2); }
  .save:active{ transform:translateY(1px) scale(0.995); }
  .save svg{ width:19px; height:19px; flex:none; }

  /* Share / QR row */
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions[hidden]{ display:none; }
  .actions button{
    min-height:52px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:0 10px;
    border-radius:var(--r);
    border:1px solid var(--line);
    background:var(--fill);
    color:var(--cream);
    font-family:var(--sans); font-size:15px; font-weight:500;
    cursor:pointer;
    transition:background .18s ease, transform .12s ease;
  }
  .actions button:hover{ background:var(--fill-hover); }
  .actions button:active{ transform:translateY(1px); }
  .actions svg{ width:18px; height:18px; color:var(--cream); }

  /* Quick row */
  .quick{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:6px; }
  .quick a{
    min-height:86px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    padding:12px 6px;
    border-radius:18px;
    border:1px solid var(--line);
    background:var(--fill);
    color:var(--cream);
    text-decoration:none;
    font-size:14px; font-weight:500;
    transition:background .18s ease, transform .12s ease;
  }
  .quick a:hover{ background:var(--fill-hover); }
  .quick a:active{ transform:translateY(1px); }
  .quick svg{ width:22px; height:22px; color:var(--accent); }

  /* Divider */
  .sep{
    display:flex; align-items:center; gap:12px;
    margin:20px 0 6px;
    color:var(--cream-dim);
    font-size:11px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase;
  }
  .sep::before, .sep::after{ content:""; height:1px; flex:1; background:var(--line); }

  /* Socials */
  .socials{ display:flex; flex-direction:column; gap:8px; }
  .social{
    min-height:64px;
    display:flex; align-items:center; gap:14px;
    padding:10px 16px 10px 12px;
    border-radius:var(--r);
    border:1px solid var(--line-soft);
    background:var(--fill);
    color:var(--cream);
    text-decoration:none;
    transition:background .18s ease, transform .12s ease;
  }
  .social:hover{ background:var(--fill-hover); }
  .social:active{ transform:translateY(1px); }
  .social .ic{
    width:40px; height:40px; flex:none; border-radius:12px;
    display:grid; place-items:center;
    color:var(--accent);
    background:rgba(196,184,147,0.08);
  }
  .social .ic svg{ width:20px; height:20px; }
  .social .tx{ display:flex; flex-direction:column; gap:2px; line-height:1.25; }
  .social .tx .name{ font-size:15px; font-weight:600; }
  .social .tx .sub{ font-size:13px; color:var(--cream-dim); }
  .social .go{ margin-left:auto; color:var(--cream-dim); display:grid; }
  .social .go svg{ width:17px; height:17px; }

  /* Footer */
  footer{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line-soft);
    text-align:center;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--cream-dim);
  }
  footer a{ color:var(--accent); text-decoration:none; }

  /* ---------- QR overlay ---------- */
  #qrModal{
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(0,0,0,0.78);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{
    background:var(--cream); border-radius:24px;
    padding:24px 22px 20px; max-width:330px; width:100%;
    text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);
  }
  #qrModal .sheet h3{
    margin:0 0 4px; font-family:var(--display); font-weight:600;
    font-size:26px; color:#0b0b0b;
  }
  #qrModal .sheet p{ margin:0 0 14px; font-size:12px; color:#5f5b52; word-break:break-all; }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; border-radius:12px; }
  #qrModal .close{
    margin-top:14px; width:100%; min-height:50px; border:0; border-radius:14px; cursor:pointer;
    font-family:var(--sans); font-size:15px; font-weight:600;
    color:var(--cream); background:#0b0b0b;
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:#0b0b0b; color:var(--cream);
    border:1px solid var(--line);
    padding:12px 16px; border-radius:14px;
    font-size:14px; max-width:88vw;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion:no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .body .reveal:nth-child(2){ animation-delay:.05s }
    .body .reveal:nth-child(3){ animation-delay:.10s }
    .body .reveal:nth-child(n+4){ animation-delay:.15s }
    @keyframes rise{ to{ opacity:1; transform:none; } }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:10px; }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="hero">
      <div class="hero-top">
        <p class="eyebrow">Ostfildern · Deutschland</p>
        <div class="lang" role="group" aria-label="Sprache / Language">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <div class="portrait" id="portrait" hidden></div>
      <div class="hero-text reveal">
        <div class="monogram" id="monogram" hidden>JP</div>
        <h1 id="name">Julian N. Petrow</h1>
        <p class="role" id="role"></p>
        <ul class="chips" id="chips" hidden></ul>
        <div class="cred" id="cred" hidden></div>
      </div>
    </div>

    <div class="body">
      <button class="save reveal" id="saveBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span id="saveLabel">Kontakt speichern</span>
      </button>

      <div class="actions reveal" id="actions">
        <button id="shareBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
          <span id="shareLabel">Teilen</span>
        </button>
        <button id="qrBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>
          <span>QR-Code</span>
        </button>
      </div>

      <div class="quick reveal" id="quick"></div>

      <div class="sep reveal" id="sepLabel">Folgen</div>
      <nav class="socials reveal" id="socials" aria-label="Social Media"></nav>

      <footer class="reveal" id="footer"></footer>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="qrModal" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
      <h3 id="qrTitle">Scannen &amp; verbinden</h3>
      <p id="qrUrl"></p>
      <div class="qrbox" id="qrbox"></div>
      <button class="close" id="qrClose" type="button">Fertig</button>
    </div>
  </div>

<script>
/* QR generator — MIT, Kazuhiko Arase — inlined so the on-page QR works offline */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

// Copyright (c) 2009 Kazuhiko Arase

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

// Quick row — resolves each key from a core field or the socials list
function resolveAction(key){
  if (key==='call'     && CONFIG.phone)    return {ic:'phone',    label:t('call'),     href:'tel:'+CONFIG.phone.replace(/\s/g,'')};
  if (key==='whatsapp' && CONFIG.whatsapp) return {ic:'whatsapp', label:'WhatsApp', href:'https://wa.me/'+CONFIG.whatsapp};
  if (key==='email'    && CONFIG.email)    return {ic:'mail',     label:t('email'),    href:'mailto:'+CONFIG.email};
  if (key==='website'  && CONFIG.website)  return {ic:'website',  label:'Website',  href:CONFIG.website};
  const s = CONFIG.socials.find(x => x.key===key && x.url && x.url.trim());
  return s ? {ic:s.key, label:s.name, href:s.url} : null;
}
function renderQuick(){
  const quick = (CONFIG.quickActions || []).map(resolveAction).filter(Boolean);
  document.getElementById('quick').innerHTML = quick.map(q =>
    `<a href="${esc(q.href)}">${ICONS[q.ic] || ICONS.globe}<span>${esc(q.label)}</span></a>`
  ).join('');
}

// Socials
document.getElementById('socials').innerHTML = CONFIG.socials
  .filter(s => s.url && s.url.trim() && !s.hideFromList)
  .map(s => `<a class="social" href="${esc(s.url)}"${s.copy ? ` data-copy="${esc(s.copy)}"` : ' target="_blank" rel="noopener"'}>
      <span class="ic">${ICONS[s.key] || ICONS.globe}</span>
      <span class="tx"><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.sub||'')}</span></span>
      <span class="go">${ARROW}</span>
    </a>`).join('');

document.querySelectorAll('.social[data-copy]').forEach(a => a.addEventListener('click', async (e) => {
  e.preventDefault();
  const id = a.dataset.copy;
  try { await navigator.clipboard.writeText(id); toast(t('wechatCopied').replace('{id}', id)); }
  catch(err){ toast(t('wechatId').replace('{id}', id)); }
  setTimeout(() => { location.href = a.getAttribute('href'); }, 900);
}));

function applyLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('role').innerHTML = L10(CONFIG.roleHTML);
  document.querySelector('.eyebrow').textContent = [CONFIG.location.city, L10(CONFIG.location.country)].filter(Boolean).join(' · ');
  document.getElementById('saveLabel').textContent = t('save');
  document.getElementById('shareLabel').textContent = t('share');
  document.getElementById('sepLabel').textContent = t('follow');
  document.getElementById('qrTitle').innerHTML = t('qrTitle');
  document.getElementById('qrClose').textContent = t('done');
  document.getElementById('footer').innerHTML = L10(CONFIG.footerHTML);
  renderQuick();
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  applyLang(b.dataset.lang);
  try { localStorage.setItem('tapcard-lang', b.dataset.lang); } catch(e){}
}));
applyLang(LANG);

const credEl = document.getElementById('cred');
if (CONFIG.credential && CONFIG.credential.trim()){
  credEl.innerHTML = `<span>${esc(CONFIG.credential)}</span>`;
  credEl.hidden = false;
} else {
  credEl.hidden = true;
}

const chipsEl = document.getElementById('chips');
const chips = (CONFIG.chips || []).filter(c => c && String(c).trim());
if (chips.length){
  chipsEl.innerHTML = chips.map(c => `<li>${esc(c)}</li>`).join('');
  chipsEl.hidden = false;
}

/* ---- vCard: the "save my number" magic ---- */
function buildVCard(){
  const L = CONFIG.location;
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${CONFIG.lastName};${CONFIG.firstName};${CONFIG.middleName||''};;${CONFIG.suffix||''}`,
    `FN:${CONFIG.fullName}`,
    CONFIG.org   ? `ORG:${CONFIG.org}` : '',
    CONFIG.title ? `TITLE:${L10(CONFIG.title)}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET:${CONFIG.email}` : '',
    CONFIG.website ? `URL:${CONFIG.website}` : '',
    `ADR;TYPE=WORK:;;;${L.city||''};${L.region||''};;${L10(L.country)}`,
    ...CONFIG.socials.filter(s=>s.url && s.url.trim() && !s.copy).map(s=>`URL:${s.url}`),
    ...CONFIG.socials.filter(s=>s.copy).map(s=>`X-SOCIALPROFILE;TYPE=${s.key}:${s.copy}`),
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 3200);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  try{
    const blob = new Blob([buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast(t('toastSaved'));
  }catch(e){
    toast(t('toastFail'));
  }
});

/* ---- Moving portrait ---- */
(function(){
  const p = CONFIG.portrait || {};
  const el = document.getElementById('portrait');
  const src = p.video || p.image;
  if (!src) return;
  el.innerHTML = p.video
    ? `<video src="${esc(p.video)}"${p.poster ? ` poster="${esc(p.poster)}"` : ''} autoplay muted loop playsinline></video>`
    : `<img src="${esc(p.image)}" alt="${esc(CONFIG.displayName)} mit ZenScents-Duftgeräten" width="960" height="1200" decoding="async" fetchpriority="high">`;
  el.hidden = false;
  document.getElementById('monogram').hidden = true;
})();

/* ---- Share + QR ---- */
(function(){
  const wrap = document.getElementById('actions');
  const shareBtn = document.getElementById('shareBtn');
  const qrBtn = document.getElementById('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!CONFIG.showShare && !CONFIG.showQR){ wrap.hidden = true; return; }
  if (!!CONFIG.showShare !== !!CONFIG.showQR) wrap.style.gridTemplateColumns = '1fr';

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share){
          await navigator.share({ title: CONFIG.fullName, text: CONFIG.fullName, url: location.href });
        } else {
          await navigator.clipboard.writeText(location.href);
          toast(t('copied'));
        }
      }catch(e){ /* user dismissed the share sheet */ }
    });
  }

  if (CONFIG.showQR){
    const modal = document.getElementById('qrModal');
    const box = document.getElementById('qrbox');
    const openQR = () => {
      document.getElementById('qrUrl').textContent = location.href;
      if (!box.dataset.rendered && typeof qrcode === 'function'){
        try{
          const qr = qrcode(0, 'M'); qr.addData(location.href); qr.make();
          let svg = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
          svg = svg.replace(/fill="white"/g, 'fill="#F5F1EA"')
                   .replace(/fill="black"/g, 'fill="#0b0b0b"');
          box.innerHTML = svg; box.dataset.rendered = '1';
        }catch(e){ box.innerHTML = `<p>${t('qrFail')}</p>`; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
    qrBtn.addEventListener('click', openQR);
    document.getElementById('qrClose').addEventListener('click', closeQR);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeQR(); });
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && modal.classList.contains('show')) closeQR(); });
  }
})();
</script>
